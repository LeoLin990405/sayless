name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Node syntax
        run: node --check sayless.mjs && node --check asr-ark-ws.mjs
      - name: Tests
        run: npm test
      - name: Build app (no install)
        run: BUILD_ONLY=1 ./app/build.sh
